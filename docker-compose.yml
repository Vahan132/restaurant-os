# Restaurant OS — full web stack. Two run modes:
#
#  A) Behind YOUR existing host nginx (e.g. the Tailscale host, TLS):
#        docker compose up -d --build
#     Apps are published on 127.0.0.1 (api 5200, website 4000, admin 4001,
#     pos 4002, kds 4003, customer 4004) — exactly where your nginx proxy_pass
#     points. The bundled proxy does NOT start (it's behind a profile).
#
#  B) Fully self-contained (no external nginx), one origin on :80:
#        docker compose --profile bundled-proxy up -d --build
#     then open http://localhost/res
#
# Frontends reach the API SAME-ORIGIN via /res/api, so one image set runs local
# and staging unchanged. Excludes the Expo apps (customer mobile, reservations).
name: restaurant-os

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restaurantos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurantos}
      POSTGRES_DB: ${POSTGRES_DB:-restaurantos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-restaurantos} -d ${POSTGRES_DB:-restaurantos}']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./api            # reuses the existing hardened api/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:5200:5200'   # your host nginx: /res/api/ -> 127.0.0.1:5200/
    # api/Dockerfile's ENTRYPOINT (edge-entrypoint.sh) calls `node dist/main.js`, but
    # `nest build` emits dist/src/main.js here (tsconfig includes prisma/**/*.ts, so the
    # output root is the project root). Override with a cloud entrypoint: migrate, then
    # start whichever main.js exists.
    entrypoint:
      - sh
      - -c
      - 'node node_modules/prisma/build/index.js migrate deploy && exec node "$(ls dist/src/main.js dist/main.js 2>/dev/null | head -1)"'
    environment:
      NODE_ENV: ${NODE_ENV:-development}   # local: development. staging/prod: production + STORAGE_DRIVER=r2
      APP_MODE: CLOUD
      PORT: '5200'
      DATABASE_URL: postgresql://${POSTGRES_USER:-restaurantos}:${POSTGRES_PASSWORD:-restaurantos}@postgres:5432/${POSTGRES_DB:-restaurantos}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}          # ⚑ Tailscale: https://msi.tail8514ca.ts.net
      PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN:-localhost}  # ⚑ Tailscale: msi.tail8514ca.ts.net
      STORAGE_DRIVER: ${STORAGE_DRIVER:-dev}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in .env}
      PLATFORM_JWT_ACCESS_SECRET: ${PLATFORM_JWT_ACCESS_SECRET:?set in .env}
      PLATFORM_JWT_REFRESH_SECRET: ${PLATFORM_JWT_REFRESH_SECRET:?set in .env}
      CONSUMER_JWT_ACCESS_SECRET: ${CONSUMER_JWT_ACCESS_SECRET:?set in .env}
      CONSUMER_JWT_REFRESH_SECRET: ${CONSUMER_JWT_REFRESH_SECRET:?set in .env}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      SMS_NIKITA_URL: ${SMS_NIKITA_URL:-}
      SMS_NIKITA_USER: ${SMS_NIKITA_USER:-}
      SMS_NIKITA_PASS: ${SMS_NIKITA_PASS:-}
      SMS_NIKITA_ORIGINATOR: ${SMS_NIKITA_ORIGINATOR:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:5200/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  website:
    build:
      context: ./website
      args:
        NEXT_PUBLIC_API_BASE_URL: /res/api
        NEXT_PUBLIC_ADMIN_URL: /res/admin
        NEXT_PUBLIC_POS_URL: /res/pos
        NEXT_PUBLIC_KDS_URL: /res/kds
        NEXT_PUBLIC_CUSTOMER_URL_TEMPLATE: /res/m/{slug}?qr={qr}
    restart: unless-stopped
    ports:
      - '127.0.0.1:4000:4000'
    depends_on: [api]

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_BASE_URL: /res/api
        NEXT_PUBLIC_SOCKET_BASE_URL: ''
        NEXT_PUBLIC_SOCKET_PATH: /res/socket.io
        NEXT_PUBLIC_CUSTOMER_URL_TEMPLATE: /res/m/{slug}?qr={qr}
    restart: unless-stopped
    ports:
      - '127.0.0.1:4001:4001'
    depends_on: [api]

  pos:
    build:
      context: ./pos
      args:
        NEXT_PUBLIC_API_BASE_URL: /res/api
        NEXT_PUBLIC_SOCKET_BASE_URL: ''
        NEXT_PUBLIC_SOCKET_PATH: /res/socket.io
    restart: unless-stopped
    ports:
      - '127.0.0.1:4002:4002'
    depends_on: [api]

  kds:
    build:
      context: ./kds
      args:
        NEXT_PUBLIC_API_BASE_URL: /res/api
        NEXT_PUBLIC_SOCKET_BASE_URL: ''
        NEXT_PUBLIC_SOCKET_PATH: /res/socket.io
    restart: unless-stopped
    ports:
      - '127.0.0.1:4003:4003'
    depends_on: [api]

  customer:
    build:
      context: ./customer
      args:
        NEXT_PUBLIC_API_BASE_URL: /res/api
    restart: unless-stopped
    ports:
      - '127.0.0.1:4004:4004'
    depends_on: [api]

  # Bundled HTTP proxy — ONLY for the self-contained mode (mode B). Opt in with
  # `--profile bundled-proxy`. Skip it when your own nginx fronts the stack.
  proxy:
    image: nginx:1.27-alpine
    profiles: ["bundled-proxy"]
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, website, admin, pos, kds, customer]

volumes:
  pgdata:
  redisdata:
