# Restaurant OS — full web stack (PULL-BASED / canonical).
# Services run PUBLISHED images from GHCR (built by .github/workflows/deploy-web.yml).
# This is what the droplet runs: `docker compose pull && docker compose up -d`.
# For local dev that builds from source, layer the override:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# IMAGE_TAG (default "develop") selects the moving channel tag; pin a sha-<short>
# in .env for rollback. COMPOSE_PROFILES=bundled-proxy (in .env) starts the bundled
# nginx on :80 — omit it if a host nginx fronts the app ports instead.
# Excludes the Expo apps (customer mobile, reservations).
name: restaurant-os

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restaurantos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurantos}
      POSTGRES_DB: ${POSTGRES_DB:-restaurantos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-restaurantos} -d ${POSTGRES_DB:-restaurantos}']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ghcr.io/vahan132/restaurant-os-api:${IMAGE_TAG:-develop}
    restart: unless-stopped
    ports:
      - '127.0.0.1:5200:5200'
    # api image ENTRYPOINT (edge-entrypoint.sh) calls `node dist/main.js`, but
    # `nest build` emits dist/src/main.js (tsconfig includes prisma/**/*.ts). Override
    # with a cloud entrypoint: migrate, then start whichever main.js exists.
    entrypoint:
      - sh
      - -c
      - 'node node_modules/prisma/build/index.js migrate deploy && exec node "$(ls dist/src/main.js dist/main.js 2>/dev/null | head -1)"'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_MODE: CLOUD
      PORT: '5200'
      DATABASE_URL: postgresql://${POSTGRES_USER:-restaurantos}:${POSTGRES_PASSWORD:-restaurantos}@postgres:5432/${POSTGRES_DB:-restaurantos}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN:-localhost}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-dev}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in .env}
      PLATFORM_JWT_ACCESS_SECRET: ${PLATFORM_JWT_ACCESS_SECRET:?set in .env}
      PLATFORM_JWT_REFRESH_SECRET: ${PLATFORM_JWT_REFRESH_SECRET:?set in .env}
      CONSUMER_JWT_ACCESS_SECRET: ${CONSUMER_JWT_ACCESS_SECRET:?set in .env}
      CONSUMER_JWT_REFRESH_SECRET: ${CONSUMER_JWT_REFRESH_SECRET:?set in .env}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      SMS_NIKITA_URL: ${SMS_NIKITA_URL:-}
      SMS_NIKITA_USER: ${SMS_NIKITA_USER:-}
      SMS_NIKITA_PASS: ${SMS_NIKITA_PASS:-}
      SMS_NIKITA_ORIGINATOR: ${SMS_NIKITA_ORIGINATOR:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:5200/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  website:
    image: ghcr.io/vahan132/restaurant-os-website:${IMAGE_TAG:-develop}
    restart: unless-stopped
    ports:
      - '127.0.0.1:4000:4000'
    depends_on: [api]

  admin:
    image: ghcr.io/vahan132/restaurant-os-admin:${IMAGE_TAG:-develop}
    restart: unless-stopped
    ports:
      - '127.0.0.1:4001:4001'
    depends_on: [api]

  pos:
    image: ghcr.io/vahan132/restaurant-os-pos:${IMAGE_TAG:-develop}
    restart: unless-stopped
    ports:
      - '127.0.0.1:4002:4002'
    depends_on: [api]

  kds:
    image: ghcr.io/vahan132/restaurant-os-kds:${IMAGE_TAG:-develop}
    restart: unless-stopped
    ports:
      - '127.0.0.1:4003:4003'
    depends_on: [api]

  customer:
    image: ghcr.io/vahan132/restaurant-os-customer:${IMAGE_TAG:-develop}
    restart: unless-stopped
    ports:
      - '127.0.0.1:4004:4004'
    depends_on: [api]

  # Bundled HTTP proxy — starts only when COMPOSE_PROFILES includes "bundled-proxy"
  # (or `--profile bundled-proxy`). Omit when a host nginx fronts the app ports.
  proxy:
    image: nginx:1.27-alpine
    profiles: ["bundled-proxy"]
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, website, admin, pos, kds, customer]

volumes:
  pgdata:
  redisdata:
