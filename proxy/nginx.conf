# Restaurant OS — path-based HTTP reverse proxy (local + bare-IP staging).
# One origin, routed under /res/* to each service by longest-match. Mirrors the
# proven map in DEPLOY.md, retargeted to compose service names and HTTP :80.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;

    # Inherited by every plain proxy_pass below.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Realtime — socket.io (websocket upgrade). /res/socket.io/ -> api:5200/socket.io/
    # (a location with its own proxy_set_header does NOT inherit the server ones, so
    # the forwarding headers are repeated here.)
    location /res/socket.io/ {
        proxy_pass http://api:5200/socket.io/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 600s;
    }

    # API — strip the /res/api prefix (trailing slash on proxy_pass does this).
    location /res/api/ { proxy_pass http://api:5200/; }

    # Next apps — keep the full path (each app's baked basePath is included).
    # Most specific first; /res is the website catch-all.
    location ^~ /res/admin { proxy_pass http://admin:4001; }
    location ^~ /res/pos   { proxy_pass http://pos:4002; }
    location ^~ /res/kds   { proxy_pass http://kds:4003; }
    location ^~ /res/m     { proxy_pass http://customer:4004; }
    location /res          { proxy_pass http://website:4000; }

    # Bare root convenience -> website.
    location = / { return 302 /res; }
}
