# Restaurant OS — path-based HTTP reverse proxy (bundled proxy for the compose stack).
# One origin, routed under /res/* to each service by longest-match.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Upstreams are addressed by compose SERVICE NAME, and
    # containers get a NEW IP on every redeploy. Without runtime re-resolution nginx
    # caches the first IP forever and 502s after any `docker compose up -d`. The
    # `resolver` + a variable in each `proxy_pass` force per-request DNS lookup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Inherited by every plain (non-socket) location below.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Realtime — socket.io (websocket upgrade). /res/socket.io/ -> api:5200/socket.io/
    # Variable proxy_pass won't rewrite the path, so strip+remap explicitly. This
    # location sets its own headers, so the forwarding headers are repeated here.
    location /res/socket.io/ {
        set $upstream_socket http://api:5200;
        rewrite ^/res/socket\.io/(.*)$ /socket.io/$1 break;
        proxy_pass $upstream_socket;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 600s;
    }

    # API — strip the /res/api prefix. With a variable proxy_pass the trailing-slash
    # trick no longer strips, so do it with an explicit rewrite.
    location /res/api/ {
        set $upstream_api http://api:5200;
        rewrite ^/res/api/(.*)$ /$1 break;
        proxy_pass $upstream_api;
    }

    # Next apps — keep the full path (each app's baked basePath is included). A
    # variable proxy_pass with no URI part forwards the request URI as-is, which is
    # exactly what these basePath apps expect. Most specific first.
    location ^~ /res/admin {
        set $upstream_admin http://admin:4001;
        proxy_pass $upstream_admin;
    }
    location ^~ /res/pos {
        set $upstream_pos http://pos:4002;
        proxy_pass $upstream_pos;
    }
    location ^~ /res/kds {
        set $upstream_kds http://kds:4003;
        proxy_pass $upstream_kds;
    }
    location ^~ /res/m {
        set $upstream_customer http://customer:4004;
        proxy_pass $upstream_customer;
    }
    location /res {
        set $upstream_website http://website:4000;
        proxy_pass $upstream_website;
    }

    # Bare root convenience -> website.
    location = / { return 302 /res; }
}
