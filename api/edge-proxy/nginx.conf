# Restaurant OS — EDGE hub reverse proxy (baked into the edge-proxy image).
# Mirrors the cloud path routing (proxy/nginx.conf) but LAN-only and limited to
# what the hub serves: POS, KDS, Admin + the API/socket. No website, no customer.
#
# This is what makes the hub work with NO internet: a device opens
# http://<hub-LAN-IP>/res/{pos,kds,admin} and both the UI and the API are local.
# The apps are built SAME-ORIGIN, so they call /res/api + /res/socket.io on
# whatever host served them — here, the hub.
#
# NOTE: the api is reached at api:3001 on the compose network (the EDGE default
# PORT). Keep PORT=3001 in .env.edge when using this bundled proxy.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;

    # Docker embedded DNS + a variable upstream force per-request re-resolution,
    # so nginx doesn't cache a stale container IP and 502 after `up -d`.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Realtime — socket.io (websocket upgrade). /res/socket.io/ -> api:3001/socket.io/
    location /res/socket.io/ {
        set $up http://api:3001;
        rewrite ^/res/socket\.io/(.*)$ /socket.io/$1 break;
        proxy_pass $up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 600s;
    }

    # API — strip the /res/api prefix (explicit rewrite; variable proxy_pass
    # disables the trailing-slash strip).
    location /res/api/ {
        set $up http://api:3001;
        rewrite ^/res/api/(.*)$ /$1 break;
        proxy_pass $up;
    }

    # Next apps — keep the full path (each app's baked basePath is included).
    # Most specific first.
    location ^~ /res/admin { set $up http://admin:4001; proxy_pass $up; }
    location ^~ /res/pos   { set $up http://pos:4002;   proxy_pass $up; }
    location ^~ /res/kds   { set $up http://kds:4003;   proxy_pass $up; }

    # Bare root -> POS (the primary till). Adjust to taste.
    location = /    { return 302 /res/pos; }
    location = /res { return 302 /res/pos; }
}
