# -- Restaurant OS -- EDGE hub (admin-facing, PULL-based) ---------------------
# The canonical file an admin DOWNLOADS and runs. A single on-prem node serving
# ONE branch: the API in EDGE mode + a volume-persisted local Postgres. No Redis
# (Socket.IO runs in-process).
#
# This file PULLS the published public image from GHCR -- it does NOT build. Any
# Docker host (Windows/Linux/macOS) can run it with no registry credentials.
#
# Admin usage (download + run):
#   cp .env.edge.example .env.edge   # set secrets; pin EDGE_IMAGE_TAG
#   docker compose -f docker-compose.edge.yml --env-file .env.edge up -d
#   # -> boots UNPAIRED into setup mode; pair at http://<host>:3001/setup
#
# Update (EDGE-UPDATE-1): automatic — the `updater` service below pulls newer
# images and recreates changed containers in place (also on "Update now" in the
# dashboard). Manual equivalent (what update.cmd / update.sh do):
#   docker compose -f docker-compose.edge.yml --env-file .env.edge pull
#   docker compose -f docker-compose.edge.yml --env-file .env.edge up -d
#   # entrypoint runs `prisma migrate deploy` on boot -> safe pull->migrate->restart
#
# Local DEVELOPMENT (build from source instead of pull): layer the build
# override, which restores `build:` on the api service:
#   docker compose -f docker-compose.edge.yml -f docker-compose.edge.build.yml \
#     --env-file .env.edge up -d --build
services:
  postgres:
    image: postgres:16
    container_name: restaurantos-edge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EDGE_DB_USER:-restaurantos}
      POSTGRES_PASSWORD: ${EDGE_DB_PASSWORD:-restaurantos}
      POSTGRES_DB: ${EDGE_DB_NAME:-restaurantos}
    volumes:
      - edge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${EDGE_DB_USER:-restaurantos} -d ${EDGE_DB_NAME:-restaurantos}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # PULL the published public image (EDGE-PKG-1 section 2.2). Pin a known-good
    # release with EDGE_IMAGE_TAG=edge-vX.Y.Z in .env.edge so "download compose +
    # run" gets a coordinated compose+image pair. Unset -> tracks `latest`.
    image: ghcr.io/vahan132/restaurant-os-edge:${EDGE_IMAGE_TAG:-latest}
    container_name: restaurantos-edge-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_MODE: EDGE
      PORT: ${PORT:-3001}

      # Edge identity -- DELIVERED BY PAIRING (EDGE-SETUP-3A), not hand-set. Leave
      # these blank on a fresh hub: it boots UNPAIRED into setup mode, and
      # POST /setup/pair persists the real values to EDGE_IDENTITY_PATH, which the
      # entrypoint sources on the next boot (overriding these). Blank-safe.
      EDGE_ORG_ID: ${EDGE_ORG_ID:-}
      EDGE_RESTAURANT_ID: ${EDGE_RESTAURANT_ID:-}
      EDGE_BRANCH_ID: ${EDGE_BRANCH_ID:-}
      EDGE_NODE_ID: ${EDGE_NODE_ID:-}
      # Durable path for the persisted pairing identity (on the edge_data volume).
      EDGE_IDENTITY_PATH: ${EDGE_IDENTITY_PATH:-/data/edge-identity.env}

      # Local Postgres (the compose service above).
      DATABASE_URL: postgresql://${EDGE_DB_USER:-restaurantos}:${EDGE_DB_PASSWORD:-restaurantos}@postgres:5432/${EDGE_DB_NAME:-restaurantos}?schema=public

      # Tenant auth secrets (tokens minted for this restaurant's users).
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Required by env validation though the platform module is excluded on edge.
      PLATFORM_JWT_ACCESS_SECRET: ${PLATFORM_JWT_ACCESS_SECRET:-edge-unused-platform-access-secret}
      PLATFORM_JWT_REFRESH_SECRET: ${PLATFORM_JWT_REFRESH_SECRET:-edge-unused-platform-refresh-secret}
      # Consumer (customer) auth secrets -- REQUIRED by env validation (CX-2), so
      # the hub must have them to boot even in setup mode. Used if the edge serves
      # customer-facing ordering. Supply real per-hub values via .env.edge.
      CONSUMER_JWT_ACCESS_SECRET: ${CONSUMER_JWT_ACCESS_SECRET}
      CONSUMER_JWT_REFRESH_SECRET: ${CONSUMER_JWT_REFRESH_SECRET}

      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN:-edge.local}

      # Object storage (MEDIA-1): the edge hub serves media LOCALLY (dev driver) so
      # it stays secret-free (no R2 credentials on the mini-PC). Uploads persist on
      # the edge_data volume (/data/media) and survive updates. The dev-driver-in-
      # production guard is exempted for EDGE (see env.schema.ts).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-dev}
      MEDIA_DEV_DIR: ${MEDIA_DEV_DIR:-/data/media}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:3001}

      # Pairing: CLOUD_URL is a FIXED image constant (your platform), used pre-
      # pairing to call {CLOUD_URL}/edge/pair and after to pull snapshots. The node
      # token + fiscal KEK are DELIVERED BY PAIRING (EDGE-SETUP-3A) and persisted;
      # leave EDGE_NODE_TOKEN / FISCAL_MASTER_KEK blank on a fresh hub.
      CLOUD_URL: ${CLOUD_URL:-}
      EDGE_NODE_TOKEN: ${EDGE_NODE_TOKEN:-}
      FISCAL_MASTER_KEK: ${FISCAL_MASTER_KEK:-}

      # Config sync (OFF-3): cloud->edge config poll interval (ms, min 30000).
      CONFIG_SYNC_INTERVAL_MS: ${CONFIG_SYNC_INTERVAL_MS:-120000}

      # Operational push (OFF-4): edge->cloud outbox drain interval (ms, min 5000).
      EDGE_PUSH_INTERVAL_MS: ${EDGE_PUSH_INTERVAL_MS:-30000}

      # Heartbeat (OFF-8): edge->cloud telemetry/version report interval (30-60s).
      EDGE_HEARTBEAT_INTERVAL_MS: ${EDGE_HEARTBEAT_INTERVAL_MS:-45000}
      # Schema-version report override (OFF-8) -- leave blank in production; set to
      # force a SCHEMA_MISMATCH for testing the update flow.
      EDGE_SCHEMA_VERSION: ${EDGE_SCHEMA_VERSION:-}

      # OFF-1 smoke seed -- leave false in the OFF-2 flow (snapshot supersedes it).
      EDGE_SEED: ${EDGE_SEED:-false}
      EDGE_SEED_OWNER_EMAIL: ${EDGE_SEED_OWNER_EMAIL:-owner@edge.local}
      EDGE_SEED_OWNER_PASSWORD: ${EDGE_SEED_OWNER_PASSWORD:-ChangeMe123!}

      # Hub-vouched devices (EDGE-OFFLINE-UI). The dashboard bakes these into
      # .env.edge; they MUST reach the container or GET /edge/device-key 404s, the
      # hub-served POS/KDS never get a device secret, and PIN login fails.
      EDGE_POS_DEVICE_SECRET: ${EDGE_POS_DEVICE_SECRET:-}
      EDGE_KDS_DEVICE_SECRET: ${EDGE_KDS_DEVICE_SECRET:-}
      # Staff PIN policy + real client IP behind the bundled proxy.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PIN_MAX_ATTEMPTS: ${PIN_MAX_ATTEMPTS:-}
      PIN_LOCKOUT_MINUTES: ${PIN_LOCKOUT_MINUTES:-}

      # Fiscal / HDM (HDM-TM-1). The branch HDM config syncs down from the cloud
      # envelope-encrypted; the DB backend reads it and the hub fetches its own
      # per-hub KEK from the cloud (persisted to /data/fiscal-kek). A NEW variable
      # name on purpose: older bundles wrote FISCAL_CONFIG_BACKEND=FILE, which
      # would hide the HDM config from the hub.
      FISCAL_CONFIG_BACKEND: ${EDGE_FISCAL_CONFIG_BACKEND:-DB}
      FISCAL_SRC_CA_PATH: ${FISCAL_SRC_CA_PATH:-}
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    volumes:
      # EDGE-SETUP-3A: durable store for the persisted pairing identity
      # (/data/edge-identity.env, written 0600 by POST /setup/pair, sourced by the
      # entrypoint on boot). Survives container recreation.
      - edge_data:/data

  # ── EDGE-OFFLINE-UI — serve the frontends from the hub (LAN, offline) ────────
  # Makes the hub a local mirror of the cloud stack so POS/KDS/Admin work with NO
  # internet: a device opens http://<hub-LAN-IP>/res/{pos,kds,admin} and the UI +
  # API are both local; data resyncs to the cloud when the link returns. The apps
  # are SAME-ORIGIN builds (one image runs on cloud and hub). These three images
  # and the edge-proxy image MUST be PUBLIC on GHCR (no creds on a hub) — see CI.
  # Open TCP 80 (HTTP_PORT) on the hub's firewall for LAN devices.
  admin:
    image: ghcr.io/vahan132/restaurant-os-admin:${EDGE_UI_TAG:-develop}
    container_name: restaurantos-edge-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  pos:
    image: ghcr.io/vahan132/restaurant-os-pos:${EDGE_UI_TAG:-develop}
    container_name: restaurantos-edge-pos
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  kds:
    image: ghcr.io/vahan132/restaurant-os-kds:${EDGE_UI_TAG:-develop}
    container_name: restaurantos-edge-kds
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  # Bundled reverse proxy (nginx with /res/* routing baked in). Primary LAN entry
  # point for the UI. The API also stays published on :${PORT:-3001} for /setup
  # pairing and direct access.
  proxy:
    image: ghcr.io/vahan132/restaurant-os-edge-proxy:${EDGE_IMAGE_TAG:-latest}
    container_name: restaurantos-edge-proxy
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      api:
        condition: service_started
      admin:
        condition: service_started
      pos:
        condition: service_started
      kds:
        condition: service_started

  # ── EDGE-UPDATE-1 — in-place updater ─────────────────────────────────────────
  # Keeps the hub on the same version as the cloud with NO reinstall: every
  # EDGE_AUTO_UPDATE_MINUTES (and immediately when "Update now" is clicked in the
  # dashboard → Hubs) it re-downloads this compose file, pulls newer images and
  # recreates ONLY the containers whose image changed. Data (edge_pgdata) and
  # pairing (edge_data) are named volumes, so they survive; the API applies new
  # DB migrations on start. Uses the host Docker socket (Docker Desktop and Linux
  # both expose /var/run/docker.sock). It never recreates itself — re-run
  # run.cmd / run.sh to pick up a new updater definition.
  #   EDGE_AUTO_UPDATE=false          -> only update on "Update now" / update.cmd
  #   EDGE_AUTO_UPDATE_MINUTES=15     -> check interval
  updater:
    image: docker:27-cli
    container_name: restaurantos-edge-updater
    restart: unless-stopped
    environment:
      EDGE_AUTO_UPDATE: ${EDGE_AUTO_UPDATE:-true}
      EDGE_AUTO_UPDATE_MINUTES: ${EDGE_AUTO_UPDATE_MINUTES:-15}
      EDGE_COMPOSE_URL: ${EDGE_COMPOSE_URL:-https://raw.githubusercontent.com/Vahan132/restaurant-os-hub/main/docker-compose.edge.yml}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The install folder (this compose file + .env.edge).
      - ./:/hub
      # Shared with the API: update-request (written on "Update now") + status.
      - edge_data:/edge-data
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -u
        COMPOSE=/hub/docker-compose.edge.yml
        ENVF=/hub/.env.edge
        REQ=/edge-data/update-request
        STATUS=/edge-data/update-status.json
        SERVICES="postgres api admin pos kds proxy"
        INTERVAL=$$(( $${EDGE_AUTO_UPDATE_MINUTES:-15} * 60 ))
        [ "$$INTERVAL" -ge 300 ] || INTERVAL=300
        PROJECT=$$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' restaurantos-edge-updater 2>/dev/null)
        if [ -z "$$PROJECT" ]; then echo "[updater] cannot resolve compose project; idling"; exec sleep infinity; fi
        echo "[updater] project=$$PROJECT auto=$$EDGE_AUTO_UPDATE every $$INTERVAL s"
        dc() { docker compose -p "$$PROJECT" -f "$$COMPOSE" --env-file "$$ENVF" "$$@"; }
        status() { printf '{"at":"%s","trigger":"%s","result":"%s"}\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$1" "$$2" > "$$STATUS" 2>/dev/null || true; }
        run_update() {
          echo "[updater] $$(date -u +%FT%TZ) checking for updates ($$1)"
          if wget -q -T 30 -O /tmp/compose.yml "$$EDGE_COMPOSE_URL" \
             && docker compose -p "$$PROJECT" -f /tmp/compose.yml --env-file "$$ENVF" config -q >/dev/null 2>&1; then
            if ! cmp -s /tmp/compose.yml "$$COMPOSE"; then
              cp /tmp/compose.yml "$$COMPOSE" && echo "[updater] compose file refreshed"
            fi
          else
            echo "[updater] could not refresh compose (offline?) - using the local copy"
          fi
          if ! dc pull --quiet $$SERVICES; then
            echo "[updater] pull failed (offline?) - will retry"; status "$$1" "pull-failed"; return
          fi
          if dc up -d $$SERVICES; then
            docker image prune -f >/dev/null 2>&1 || true
            echo "[updater] up to date"; status "$$1" "ok"
          else
            echo "[updater] up failed"; status "$$1" "up-failed"
          fi
        }
        last=0
        while :; do
          now=$$(date +%s)
          if [ -f "$$REQ" ]; then
            rm -f "$$REQ"; run_update manual; last=$$now
          elif [ "$$EDGE_AUTO_UPDATE" = "true" ] && [ $$(( now - last )) -ge "$$INTERVAL" ]; then
            run_update auto; last=$$now
          fi
          sleep 30
        done

volumes:
  edge_pgdata:
  edge_data:
